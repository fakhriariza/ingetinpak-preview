<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="IngetinPak">
  <!-- Markah IngetinPak: perisai (perlindungan dari denda & keterlambatan)
       dengan dua pengait kalender di atas dan centang "beres".
       Palet gaya GoPay dark fintech: perisai gradasi biru aksen,
       pengait biru muda, centang putih.
       Karya geometris programatik — bukan gambar AI. -->
  <defs>
    <linearGradient id="ip-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29B6E8"/>
      <stop offset="1" stop-color="#0077B6"/>
    </linearGradient>
  </defs>
  <rect x="20.5" y="3" width="5" height="11" rx="2.5" fill="#7CD4F2"/>
  <rect x="38.5" y="3" width="5" height="11" rx="2.5" fill="#7CD4F2"/>
  <path d="M32 7 L53 13.5 V29 C53 44 44.5 53.5 32 59.5 C19.5 53.5 11 44 11 29 V13.5 Z" fill="url(#ip-shield)"/>
  <path d="M21 32.5 L28.5 40 L43.5 24" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
